<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="547" viewBox="0 0 1040 547" fill="none" role="img">
  <rect width="1040" height="547" rx="16" fill="#0a0b0e" stroke="#20242c"/>
  <rect x="30" y="24" width="980" height="170" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="46" y="46" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#8b929c">IDENTITY · WHAT MAKES AN ACCOUNT</text>
  <path d="M56 66 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="79" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#f4f1ea">BIP39 seed</text>
    <text x="500" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3cad3">twelve words, generated locally. Lose them and the account is gone: nobody can reset</text>
    <text x="500" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3cad3">it</text>
  <path d="M56 113 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="126" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#f4f1ea">crypto_kx_seed_keypair</text>
    <text x="500" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3cad3">derives the X25519 keypair from that seed, so the same words always rebuild the same</text>
    <text x="500" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3cad3">identity</text>
  <path d="M56 160 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="173" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#f4f1ea">crypto_pwhash + secretbox</text>
    <text x="500" y="173" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3cad3">Argon2 over your PIN, wrapping the seed at rest on the device</text>
  <rect x="30" y="212" width="980" height="153" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="46" y="234" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#8b929c">CONVERSATION · WHAT PROTECTS A MESSAGE</text>
  <path d="M56 254 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="267" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#f4f1ea">crypto_kx_*_session_keys</text>
    <text x="500" y="267" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3cad3">one pair of session keys per peer, derived at connection time</text>
  <path d="M56 284 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="297" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#f4f1ea">chacha20poly1305_ietf</text>
    <text x="500" y="297" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3cad3">encrypts and authenticates every message on the direct channel</text>
  <rect x="48" y="316" width="16" height="14" rx="4" fill="none" stroke="#d8a35f" stroke-width="1.4"/><circle cx="53" cy="322" r="1.4" fill="#d8a35f"/><circle cx="59" cy="322" r="1.4" fill="#d8a35f"/>
    <text x="76" y="327" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#f4f1ea">SAS, four words</text>
    <text x="500" y="327" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3cad3">derived from both session keys; read them aloud and a man in the middle cannot match</text>
    <text x="500" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3cad3">them</text>
  <rect x="30" y="383" width="980" height="140" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="46" y="405" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#8b929c">RELAY · WHAT IT IS NEVER GIVEN</text>
  <path d="M56 425 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="438" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#f4f1ea">crypto_box_seal</text>
    <text x="500" y="438" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3cad3">the WebRTC offer and answer are sealed to the recipient's public key before the</text>
    <text x="500" y="455" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3cad3">relay sees them</text>
  <path d="M56 472 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="485" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#f4f1ea">backup blob</text>
    <text x="500" y="485" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3cad3">roster and history encrypted with a key derived from your seed; the relay stores</text>
    <text x="500" y="502" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c3cad3">bytes it cannot open</text>
</svg>