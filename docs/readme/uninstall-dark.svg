<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" viewBox="0 0 1040 310" fill="none" role="img">
  <defs><marker id="stp-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b929c"/></marker></defs>
  <rect width="1040" height="310" rx="16" fill="#0a0b0e" stroke="#20242c"/>
  <text x="30" y="36" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12" letter-spacing="2.5" fill="#8b929c">ERASE YOURSELF</text>
  <rect x="30" y="56" width="478" height="103" rx="12" fill="#161b22" stroke="#2a313c"/>
  <circle cx="56" cy="82" r="13" fill="#d8a35f"/>
  <text x="56" y="87" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#0a0b0e">1</text>
  <text x="78" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#f4f1ea">There is no button for it yet</text>
  
  <text x="44" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">The app has no reset or log-out. Deleting an identity is manual today, and</text><text x="44" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">that is a gap rather than a design choice.</text><path d="M512 82 l16 0" stroke="#8b929c" stroke-width="1.4" marker-end="url(#stp-dark)"/>
  <rect x="532" y="56" width="478" height="103" rx="12" fill="#161b22" stroke="#2a313c"/>
  <circle cx="558" cy="82" r="13" fill="#d8a35f"/>
  <text x="558" y="87" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#0a0b0e">2</text>
  <text x="580" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#f4f1ea">In the browser</text>
  
  <text x="546" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">Clear every localStorage key starting with nullnode. That removes the</text><text x="546" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">roster, the history and the sealed vault. Without your twelve words the</text><text x="546" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">account is then gone for good.</text>
  <rect x="30" y="183" width="478" height="103" rx="12" fill="#161b22" stroke="#2a313c"/>
  <circle cx="56" cy="209" r="13" fill="#d8a35f"/>
  <text x="56" y="214" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#0a0b0e">3</text>
  <text x="78" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#f4f1ea">On the relay</text>
  
  <text x="44" y="243" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">Drop your address from relay/data/envelopes.json and</text><text x="44" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">relay/data/backups.json. Nothing in the protocol lets a client ask for</text><text x="44" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">that remotely.</text>
</svg>